<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullarium Felix’ V.</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<main class="narrow">
  <h1><span data-i18n="ent.h1"></span> <span class="badge-auto" data-i18n="ent.badge"></span></h1>
  <p class="lede" data-i18n="ent.lede"></p>
  <div class="toolbar" style="padding-left:0">
    <select id="vol" data-i18n-attr="aria-label:vol"></select>
    <label><input type="checkbox" id="only-bad"> <span data-i18n="ent.onlyBad"></span></label>
    <span id="count" class="muted"></span>
  </div>
  <div class="tablewrap"><table><thead><tr data-i18n-th="ent.th"></tr></thead>
    <tbody id="rows"><tr><td colspan="6" data-i18n="loading"></td></tr></tbody></table></div>
</main>
<script src="i18n.js?v=13"></script>
<script src="common.js?v=13"></script>
<script>
header("eintraege.html");
setTitle("title.entries");
const q = new URLSearchParams(location.search);
let V = +(q.get("v") || 1), data = [];
const byId = {};
function entryHref(e) { return `band.html?v=${V}&p=${e.s[0]}&l=${e.s[1] + 1}&e=${e.id}`; }

// preview of the entry's first lines, cut from the Transkribus image (IIIF region)
const prev = document.createElement("div");
prev.className = "eprev"; prev.hidden = true;
prev.innerHTML = `<img alt=""><div class="cap muted"></div>`;
document.body.appendChild(prev);
let prevFor = null;
function showPreview(e, row) {
  if (!e.pk || !e.bx) { prev.hidden = true; return; }
  const [x0, y0, x1, y1] = e.bx, pad = 40;
  const x = Math.max(0, x0 - pad), y = Math.max(0, y0 - pad), w = x1 - x0 + 2 * pad, h = Math.min(y1 - y0 + 2 * pad, 1400);
  const img = prev.querySelector("img");
  if (prevFor !== e.id) {
    img.src = `${IIIF(e.pk)}/${x},${y},${w},${h}/520,/0/default.jpg`;
    img.alt = t("ent.preview", { id: e.id });
    prev.querySelector(".cap").textContent = `${e.id} · ${t("img")} ${e.s[0]}${fmtDate(e.d) ? " · " + fmtDate(e.d) : ""}`;
    prevFor = e.id;
  }
  const r = row.getBoundingClientRect();
  const below = r.bottom + 8, room = window.innerHeight - below;
  prev.style.top = (room > 260 ? below : Math.max(8, r.top - 8 - Math.min(420, prev.offsetHeight || 300))) + "px";
  prev.style.left = Math.min(window.innerWidth - 548, Math.max(8, r.left + 120)) + "px";
  prev.hidden = false;
}

function draw() {
  const bad = document.getElementById("only-bad").checked;
  const rows = data.filter(e => !bad || (e.d.check === "mismatch" || e.d.check === "range"));
  document.getElementById("count").textContent = t("ent.count", { n: num(rows.length), total: num(data.length) });
  document.getElementById("rows").innerHTML = rows.map(e => `<tr class="erow" tabindex="0" data-id="${e.id}" title="${esc(t("ent.open"))}">
    <td class="mono">${e.id}</td>
    <td><a href="${entryHref(e)}">${e.s[0]}${e.e[0] !== e.s[0] ? "–" + e.e[0] : ""}</a></td>
    <td style="white-space:nowrap">${fmtDate(e.d) || '<span class="muted">–</span>'}</td><td style="white-space:nowrap">${dateFlag(e.d)}</td>
    <td>${esc(e.d.place || "")}</td>
    <td style="font-family:'Source Serif 4',Georgia,serif">${esc(e.inc)} …<br><span class="muted">${esc(e.cl || "")}</span></td></tr>`).join("");
}
(async () => {
  const s = await getJSON("data/summary.json");
  const volSel = document.getElementById("vol");
  volSel.innerHTML = s.map(v => `<option value="${v.vol}">${t("vol")} ${ROMAN[v.vol]}</option>`).join("");
  volSel.value = V; volSel.onchange = () => { location.search = `?v=${volSel.value}&lang=${LANG}`; };
  document.getElementById("only-bad").onchange = draw;
  data = await getJSON(`data/entries${V}.json`);
  data.forEach(e => { byId[e.id] = e; });
  draw();
  const tb = document.getElementById("rows");
  const rowOf = ev => ev.target.closest && ev.target.closest("tr.erow");
  tb.addEventListener("mouseover", ev => { const r = rowOf(ev); if (r) showPreview(byId[r.dataset.id], r); });
  tb.addEventListener("mouseleave", () => { prev.hidden = true; });
  tb.addEventListener("focusin", ev => { const r = rowOf(ev); if (r) showPreview(byId[r.dataset.id], r); });
  tb.addEventListener("focusout", () => { prev.hidden = true; });
  tb.addEventListener("click", ev => {
    const r = rowOf(ev);
    if (!r || ev.target.closest("a")) return;
    location.href = entryHref(byId[r.dataset.id]) + `&lang=${LANG}`;
  });
  tb.addEventListener("keydown", ev => {
    const r = rowOf(ev);
    if (r && ev.key === "Enter") location.href = entryHref(byId[r.dataset.id]) + `&lang=${LANG}`;
  });
})().catch(e => { document.getElementById("rows").innerHTML = `<tr><td colspan="6">${t("error")}: ${esc(e.message)}</td></tr>`; });
</script>
</body>
</html>
