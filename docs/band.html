<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullarium Felix’ V.</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
</head>
<body>
<main>
  <div class="viewer">
    <section class="side panel" aria-label="Text">
      <div class="vnav">
        <select id="vol" data-i18n-attr="aria-label:vol"></select>
        <button id="prev" data-i18n-attr="aria-label:band.prev;title:band.prev">‹</button>
        <label><span data-i18n="img"></span> <input id="pg" type="number" min="1" data-i18n-attr="aria-label:img"></label>
        <span id="of" class="muted"></span>
        <button id="next" data-i18n-attr="aria-label:band.next;title:band.next">›</button>
        <span class="grow"></span>
        <label class="muted small" data-i18n-attr="title:band.allbox.t"><input type="checkbox" id="allbox"> <span data-i18n="band.allbox"></span></label>
      </div>
      <div class="tabs" role="tablist">
        <button id="t-text" class="on" role="tab"><span data-i18n="band.tab.text"></span> <span class="badge-auto" data-i18n="badge.short"></span></button>
        <button id="t-ent" role="tab"><span data-i18n="band.tab.ent"></span> <span id="ent-n" class="n"></span></button>
      </div>
      <div id="vhelp" class="vhelp" data-i18n="band.help"></div>
      <div id="readbar" class="readbar">
        <label><span data-i18n="band.reading"></span> <select id="reading"></select></label>
        <span id="readnote" class="muted"></span>
      </div>
      <div id="pane-text" class="pane" aria-live="polite"></div>
      <div id="pane-ent" class="pane" hidden></div>
    </section>
    <section class="img panel" aria-label="Bild"><div id="osd"></div></section>
  </div>
</main>
<script src="i18n.js?v=12"></script>
<script src="common.js?v=12"></script>
<script>
header("");
const q = new URLSearchParams(location.search);
let V = +(q.get("v") || 1), P = +(q.get("p") || 0), vol, entries, viewer, overlay, selOverlay, sel = null;
let pendingLine = q.get("l") ? +q.get("l") : null; // deep link: 1-based line number on the opening
let ENTRY = q.get("e"); // entry whose lines are highlighted (from the entry list)
let flat = []; // [{ri, li, b, n}] in reading order for the current page

function linesOf(page) { // flat list with region boundaries; region kind like segment.py
  return page.r.map(r => {
    const avg = r.l.reduce((a, l) => a + l.t.length, 0) / Math.max(1, r.l.length);
    return { marg: r.l.length <= 4 && avg < 28, lines: r.l };
  });
}

function rectOf(b, page, pad = 10) {
  const W = page.w; // IIIF width equals the PageXML width, so image coordinates match
  return new OpenSeadragon.Rect((b[0] - pad) / W, (b[1] - pad) / W, (b[2] - b[0] + 2 * pad) / W, (b[3] - b[1] + 2 * pad) / W);
}

function showBox(b, page) { // hover highlight
  if (overlay) { viewer.removeOverlay(overlay); overlay = null; }
  if (!b) return;
  const el = document.createElement("div"); el.className = "overlay-box"; overlay = el;
  viewer.addOverlay(el, rectOf(b, page));
}

function drawAllBoxes(page) {
  document.querySelectorAll(".overlay-all").forEach(el => viewer.removeOverlay(el));
  if (!document.getElementById("allbox").checked) return;
  for (const f of flat) {
    if (!f.b) continue;
    const el = document.createElement("div"); el.className = "overlay-all"; el.title = `${t("line")} ${f.n}`;
    viewer.addOverlay(el, rectOf(f.b, page, 4));
  }
}

function select(n, { zoom = true, scroll = true } = {}) { // n = 1-based line number on the opening
  const page = vol.pages[P - 1];
  document.querySelectorAll(".ln.sel").forEach(el => el.classList.remove("sel"));
  if (selOverlay) { viewer.removeOverlay(selOverlay); selOverlay = null; }
  const f = flat.find(x => x.n === n);
  sel = f ? n : null;
  history.replaceState(null, "", `?v=${V}&p=${P}${sel ? "&l=" + sel : ""}${READ !== "k" ? "&r=" + encodeURIComponent(READ) : ""}${ENTRY ? "&e=" + ENTRY : ""}&lang=${LANG}`);
  if (!f) return;
  const span = document.querySelector(`.ln[data-n="${n}"]`);
  if (span) { span.classList.add("sel"); if (scroll) span.scrollIntoView({ block: "center", behavior: "smooth" }); }
  if (!f.b) return;
  const el = document.createElement("div"); el.className = "overlay-sel"; selOverlay = el;
  viewer.addOverlay(el, rectOf(f.b, page));
  if (zoom) { // the line with some context above and below
    const r = rectOf(f.b, page, 0), h = r.height, w = r.width;
    viewer.viewport.fitBoundsWithConstraints(new OpenSeadragon.Rect(r.x - w * 0.15, r.y - h * 4, w * 1.3, h * 9));
  }
}

function lineAt(pt) { // image point -> line number (box containing it, else nearest within reach)
  let best = null, bestD = Infinity;
  for (const f of flat) {
    if (!f.b) continue;
    const [x0, y0, x1, y1] = f.b;
    const dx = pt.x < x0 ? x0 - pt.x : pt.x > x1 ? pt.x - x1 : 0;
    const dy = pt.y < y0 ? y0 - pt.y : pt.y > y1 ? pt.y - y1 : 0;
    const d = dx * 3 + dy; // prefer lines in the same column
    if (d < bestD) { bestD = d; best = f.n; }
  }
  return bestD < 120 ? best : null;
}

// ---- readings -------------------------------------------------------------------------------
// line readings: k = combined (default), t = CITlab, c = CATMuS; page readings: any model in pagereadings.json
let READ = (q.get("r") === "c" ? "l:kraken-catmus_medieval" : q.get("r")) || (() => { try { return localStorage.getItem("felix-reading"); } catch (e) { return null; } })() || "k";
let PAGEREAD = {}, SUMMARY_READERS = [];

const READER_LABEL = {
  "kraken-catmus_medieval": "kraken · CATMuS Medieval", "kraken-tridis_v2": "kraken · TRIDIS v2",
  "kraken-cremma_medieval": "kraken · CREMMA Medieval", "kraken-medieval_latin_french_expanded": "kraken · Latin/French expanded",
  "trocr-medieval-escriptmask": "TrOCR · medieval escriptmask", "trocr-catmus-base": "TrOCR · CATMuS base",
  "trocr-catmus-cursiva": "TrOCR · CATMuS cursiva",
};
const PAGE_LABEL = { "gemini-4-argon": "Gemini 4 Argon", "gemini-3.8-flash": "Gemini 3.8 Flash", "qwen3.8-27b": "qwen3.8-27b" };
const READFILES = {}; // reader -> {page: [text per line]}, loaded on demand

function readersFor(page) {
  const opts = [
    { id: "k", label: page.cm === 2 ? t("r.k.multi", { n: (page.rd || []).length + 1 }) : t("r.k"), ok: true },
    { id: "t", label: t("r.t"), ok: true },
  ];
  const all = Object.keys(READER_LABEL);
  for (const n of all) opts.push({ id: "l:" + n, label: READER_LABEL[n], ok: (page.rd || []).includes(n) });
  for (const m of Object.keys(PAGEREAD[`${V}:${page.n}`] || {})) opts.push({ id: "p:" + m, label: t("r.page", { model: PAGE_LABEL[m] || m }), ok: true });
  return opts.filter(o => o.ok || o.id.startsWith("l:") && SUMMARY_READERS.includes(o.id.slice(2)));
}

function markLow(text, spans) { // words the readers disagree on
  let out = "", pos = 0;
  for (const [a, b] of spans || []) {
    out += esc(text.slice(pos, a)) + `<mark class="unsure" title="${t("r.unsure")}">${esc(text.slice(a, b))}</mark>`;
    pos = b;
  }
  return out + esc(text.slice(pos));
}

function markC(text, spans) { // words taken over from CATMuS
  let out = "", pos = 0;
  for (const [a, b] of spans || []) {
    out += esc(text.slice(pos, a)) + `<mark class="fromc" title="${t("r.fromc")}">${esc(text.slice(a, b))}</mark>`;
    pos = b;
  }
  return out + esc(text.slice(pos));
}

async function renderText(page) {
  const opts = readersFor(page);
  let cur = opts.find(o => o.id === READ && o.ok) ? READ : "k";
  const rs = document.getElementById("reading");
  rs.innerHTML = opts.map(o => `<option value="${esc(o.id)}"${o.ok ? "" : " disabled"}${o.id === cur ? " selected" : ""}>${esc(o.label)}${o.ok ? "" : " " + t("r.missing")}</option>`).join("");
  const note = document.getElementById("readnote");
  const pt = document.getElementById("pane-text");
  if (cur.startsWith("l:") && !READFILES[cur.slice(2)]) READFILES[cur.slice(2)] = await getJSON(`data/read-${cur.slice(2)}-${V}.json`).catch(() => ({}));
  if (vol.pages[P - 1] !== page) return; // the viewer moved on while CATMuS was loading
  if (cur.startsWith("p:")) { // page reading: two halves, no line geometry
    const pr = PAGEREAD[`${V}:${page.n}`][cur.slice(2)];
    note.textContent = t("r.note.page");
    flat = [];
    pt.innerHTML = ["L", "R"].filter(sd => pr[sd]).map(sd => `<div class="region"><h3 class="half">${t(sd === "L" ? "r.left" : "r.right")}</h3>
      <pre class="pageread">${esc(pr[sd])}</pre></div>`).join("");
    return;
  }
  note.textContent = cur === "k" ? (page.cm === 2 ? t("r.note.k.multi") : page.cm ? t("r.note.k") : t("r.note.k.none"))
    : cur.startsWith("l:") ? t("r.note.line") : "";
  const catLines = cur.startsWith("l:") ? (READFILES[cur.slice(2)][page.n] || []) : null;
  let k = 0;
  flat = [];
  const html = linesOf(page).map((r, ri) => `<div class="region${r.marg ? " marg" : ""}">${r.lines.map((l, li) => {
      const n = ++k; flat.push({ ri, li, b: l.b, n });
      const body = catLines ? esc(catLines[n - 1] ?? "") : cur === "k" && l.k ? (l.k[2] ? markLow(l.k[0], l.k[1]) : markC(l.k[0], l.k[1])) : esc(l.t);
      return `<span class="ln" tabindex="0" data-n="${n}" title="${t("band.lineTitle", { n })}"><span class="no">${n}</span>${body}</span>`; }).join("")}</div>`).join("");
  pt.innerHTML = html || `<p class="muted">${t("band.notext")}</p>`;
  markEntry(page);
  if (sel) { const s = sel; sel = null; select(s, { zoom: false }); }
}

function entryRange(page) { // 1-based line numbers of ENTRY on this page, or null
  const e = ENTRY && entries.find(x => x.id === ENTRY);
  if (!e || page.n < e.s[0] || page.n > e.e[0]) return null;
  const n = page.r.reduce((a, r) => a + r.l.length, 0);
  return [page.n === e.s[0] ? e.s[1] + 1 : 1, page.n === e.e[0] ? e.e[1] + 1 : n];
}

function markEntry(page) {
  const rg = entryRange(page);
  document.querySelectorAll(".ln.inentry").forEach(el => el.classList.remove("inentry"));
  if (!rg) return;
  document.querySelectorAll(".ln[data-n]").forEach(el => { const n = +el.dataset.n; if (n >= rg[0] && n <= rg[1]) el.classList.add("inentry"); });
}

function drawEntryBoxes(page) {
  document.querySelectorAll(".overlay-entry").forEach(el => viewer.removeOverlay(el));
  const rg = entryRange(page);
  if (!rg) return;
  // one box per column: lines of the entry grouped by left/right page half
  const cols = {}, regs = linesOf(page);
  for (const f of flat) {
    if (!f.b || f.n < rg[0] || f.n > rg[1] || regs[f.ri].marg) continue; // marginal notes would stretch the box
    const side = (f.b[0] + f.b[2]) / 2 < page.w / 2 ? "L" : "R";
    const c = cols[side] || (cols[side] = [Infinity, Infinity, -Infinity, -Infinity]);
    c[0] = Math.min(c[0], f.b[0]); c[1] = Math.min(c[1], f.b[1]); c[2] = Math.max(c[2], f.b[2]); c[3] = Math.max(c[3], f.b[3]);
  }
  for (const c of Object.values(cols)) {
    const el = document.createElement("div"); el.className = "overlay-entry";
    viewer.addOverlay(el, rectOf(c, page, 25));
  }
}

function render() {
  const page = vol.pages[P - 1];
  document.getElementById("pg").value = P;
  document.getElementById("of").textContent = `/ ${vol.pages.length}`;
  history.replaceState(null, "", `?v=${V}&p=${P}${READ !== "k" ? "&r=" + encodeURIComponent(READ) : ""}${ENTRY ? "&e=" + ENTRY : ""}&lang=${LANG}`);
  setTitle("title.band", { v: ROMAN[V], p: P });
  iiifSource(page.k).then(src => { if (vol.pages[P - 1] === page) viewer.open(src); })
    .catch(() => viewer.open({ type: "image", url: TK(page.k) }));
  renderText(page);
  const pt = document.getElementById("pane-text");
  const byN = n => flat.find(x => x.n === n);
  pt.onmouseover = ev => { const s = ev.target.closest(".ln"); if (s) showBox(byN(+s.dataset.n).b, page); };
  pt.onmouseleave = () => showBox(null);
  pt.onclick = ev => { const s = ev.target.closest(".ln"); if (s) select(+s.dataset.n, { scroll: false }); };
  pt.onkeydown = ev => { const s = ev.target.closest(".ln"); if (s && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); select(+s.dataset.n, { scroll: false }); } };
  sel = null;
  renderEntries();
}

function renderEntries() {
  const here = entries.filter(e => e.s[0] <= P && e.e[0] >= P);
  document.getElementById("ent-n").textContent = here.length ? `(${here.length})` : "";
  document.getElementById("pane-ent").innerHTML = here.length
    ? `<div class="legend">${KINDS.map(k => `<span class="${k}"><i></i>${t("reg.kind." + k)}</span>`).join("")}</div>` + here.map(entryCard).join("")
    : `<p class="muted">${t("band.noent")}</p>`;
  document.getElementById("pane-ent").onclick = ev => {
    if (ev.target.closest("a")) return; // a chip opens the register
    const c = ev.target.closest(".entry-card"); if (!c) return;
    const p = +c.dataset.p, l = +c.dataset.l;
    ENTRY = c.dataset.id;
    document.getElementById("t-text").click();
    if (p === P) { const pg = vol.pages[P - 1]; markEntry(pg); drawEntryBoxes(pg); renderEntries(); select(l); } else { pendingLine = l; go(p); }
  };
}

const KINDS = ["persons", "places", "institutions", "dioceses"];
let REGESTS = {}, TERMS = {};

function entryCard(e) {
  const r = REGESTS[e.id] || {}, txt = r[LANG] || r.de;
  const terms = (TERMS[e.id] || []).slice().sort((a, b) => KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind) || a.label.localeCompare(b.label));
  const chips = terms.map(x => `<a class="chip ${x.kind}" href="register.html?k=${x.kind}&id=${x.id}" title="${esc(t("reg.kind." + x.kind))}${x.links.length ? " · " + x.links.map(l => l.source).join(", ") : ""}">${esc(x.label)}${x.links.length ? " ↗" : ""}</a>`).join("");
  return `<div class="entry-card${e.id === ENTRY ? " on" : ""}" data-id="${e.id}" data-p="${e.s[0]}" data-l="${e.s[1] + 1}" tabindex="0" title="${t("band.toEntry")}">
    <div class="eh"><span class="d">${fmtDate(e.d) || t("undated")}</span> ${dateFlag(e.d)}${e.d.place ? ` <span class="muted">${esc(e.d.place)}</span>` : ""}
      ${r.t ? `<span class="type">${t("act." + r.t)}</span>` : ""}<span class="id mono">${e.id}</span></div>
    <div class="muted small">${t("band.span", { from: e.s[0] + (e.e[0] !== e.s[0] ? "–" + e.e[0] : ""), n: e.n })}</div>
    ${txt ? `<p class="rtext">${esc(txt)}</p><div class="draft">${t("band.regdraft")}</div>` : `<div class="c">${esc(e.inc)} …</div>`}
    ${chips ? `<div class="chips">${chips}</div>` : ""}
  </div>`;
}

function go(p) { P = Math.max(1, Math.min(vol.pages.length, p)); render(); }

(async () => {
  const summary = await getJSON("data/summary.json");
  SUMMARY_READERS = [...new Set(summary.flatMap(v => Object.keys(v.readers || {})))];
  const volSel = document.getElementById("vol");
  volSel.innerHTML = summary.map(v => `<option value="${v.vol}">${t("vol")} ${ROMAN[v.vol]}</option>`).join("");
  volSel.value = V; volSel.onchange = () => { location.search = `?v=${volSel.value}&lang=${LANG}`; };
  if (!P) P = (summary.find(v => v.vol === V) || {}).start || 1; // first folio with a real entry
  [vol, entries, REGESTS] = await Promise.all([getJSON(`data/vol${V}.json`), getJSON(`data/entries${V}.json`),
    getJSON(`data/regests${V}.json`).then(rs => Object.fromEntries(rs.map(r => [r.id, r]))).catch(() => ({}))]);
  getJSON("data/entities.json").then(es => { // index terms per entry, for the entries tab
    for (const e of es) for (const id of e.entries) (TERMS[id] || (TERMS[id] = [])).push(e);
    if (vol) renderEntries();
  }).catch(() => {});
  viewer = OpenSeadragon({ id: "osd", prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/", showNavigator: true, gestureSettingsMouse: { clickToZoom: false } });
  viewer.addHandler("open", () => { // open() clears overlays: redraw, then apply a deep-linked line
    const page = vol.pages[P - 1];
    drawAllBoxes(page);
    drawEntryBoxes(page);
    if (pendingLine) { const n = pendingLine; pendingLine = null; select(n); }
    else if (sel) select(sel, { zoom: false, scroll: false });
  });
  viewer.addHandler("canvas-click", ev => { // image -> text
    if (!ev.quick) return; // a drag pans, a click selects
    const p = viewer.viewport.viewerElementToImageCoordinates(ev.position);
    const n = lineAt(p);
    if (n) { select(n, { zoom: false }); document.getElementById("t-text").click(); }
  });
  document.getElementById("allbox").onchange = () => drawAllBoxes(vol.pages[P - 1]);
  document.getElementById("prev").onclick = () => go(P - 1);
  document.getElementById("next").onclick = () => go(P + 1);
  document.getElementById("pg").onchange = ev => go(+ev.target.value);
  document.addEventListener("keydown", ev => {
    if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
    if (ev.key === "ArrowLeft") go(P - 1);
    if (ev.key === "ArrowRight") go(P + 1);
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { // step through the lines
      ev.preventDefault();
      const n = (sel || 0) + (ev.key === "ArrowDown" ? 1 : -1);
      if (n >= 1 && n <= flat.length) select(n);
    }
  });
  PAGEREAD = await getJSON("data/pagereadings.json").catch(() => ({}));
  document.getElementById("reading").onchange = ev => {
    READ = ev.target.value;
    try { localStorage.setItem("felix-reading", READ); } catch (e) { /* storage blocked */ }
    const keep = sel;
    history.replaceState(null, "", `?v=${V}&p=${P}${READ !== "k" ? "&r=" + encodeURIComponent(READ) : ""}${ENTRY ? "&e=" + ENTRY : ""}&lang=${LANG}`);
    renderText(vol.pages[P - 1]).then(() => { if (keep && flat.length) select(keep, { zoom: false }); });
  };
  const tabs = [["t-text", "pane-text"], ["t-ent", "pane-ent"]];
  tabs.forEach(([tb, p]) => document.getElementById(tb).onclick = () => tabs.forEach(([t2, p2]) => {
    document.getElementById(t2).classList.toggle("on", t2 === tb); document.getElementById(p2).hidden = p2 !== p;
    document.getElementById("readbar").hidden = tb !== "t-text"; document.getElementById("vhelp").hidden = tb !== "t-text"; }));
  render();
})().catch(e => { document.getElementById("pane-text").textContent = `${t("error")}: ${e.message}`; });
</script>
</body>
</html>
