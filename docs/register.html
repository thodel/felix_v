<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullarium Felix’ V.</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<main>
  <h1><span data-i18n="reg.h1"></span> <span class="badge-auto" data-i18n="reg.badge"></span></h1>
  <p class="lede" data-i18n="reg.lede"></p>
  <p id="stats" class="muted"></p>
  <div class="toolbar" style="padding-left:0">
    <select id="kind" data-i18n-attr="aria-label:reg.h1">
      <option value="persons" data-i18n="reg.kind.persons"></option>
      <option value="places" data-i18n="reg.kind.places"></option>
      <option value="institutions" data-i18n="reg.kind.institutions"></option>
    </select>
    <input id="filter" type="search" style="width:200px" data-i18n-attr="placeholder:reg.filter;aria-label:reg.filter">
    <span id="count" class="muted"></span>
  </div>
  <div class="tablewrap"><table><thead><tr data-i18n-th="reg.th"></tr></thead>
    <tbody id="rows"><tr><td colspan="4" data-i18n="loading"></td></tr></tbody></table></div>
  <h2 data-i18n="reg.sumH"></h2>
  <div class="tablewrap"><table><thead><tr data-i18n-th="reg.sumTh"></tr></thead><tbody id="sum"></tbody></table></div>
</main>
<script src="i18n.js?v=6"></script>
<script src="common.js?v=6"></script>
<script>
header("register.html");
setTitle("title.register");
let reg, starts = {};
function link(id) {
  const [v] = id.slice(1).split("-");
  const p = starts[id];
  return `<a class="mono" href="band.html?v=${v}&p=${p ? p[0] : 1}${p ? "&l=" + (p[1] + 1) : ""}">${id}</a>`;
}
function draw() {
  const kind = document.getElementById("kind").value, f = document.getElementById("filter").value.toLowerCase();
  const rows = reg[kind].filter(x => !f || JSON.stringify(x).toLowerCase().includes(f));
  document.getElementById("count").textContent = t("reg.count", { n: num(rows.length) });
  document.getElementById("rows").innerHTML = rows.map(x => {
    const as = [...new Set(x.refs.map(r => r.as).filter(Boolean))].map(esc).join("; ");
    const info = [...new Set(x.refs.flatMap(r => [r.role, r.office, r.diocese, r.type, r.place].filter(Boolean)))].map(esc).join(" · ");
    const ids = [...new Set(x.refs.map(r => r.entry))].map(link).join(" ");
    return `<tr><td>${esc(x.name)}</td><td style="font-family:'Source Serif 4',Georgia,serif">${as}</td><td class="muted">${info}</td><td>${ids}</td></tr>`;
  }).join("");
}
(async () => {
  try { reg = await getJSON("data/register.json"); }
  catch (e) { document.getElementById("rows").innerHTML = `<tr><td colspan="4">${t("reg.none")}</td></tr>`; return; }
  const vols = [...new Set(reg.tested.map(id => +id.slice(1).split("-")[0]))];
  for (const v of vols) for (const e of await getJSON(`data/entries${v}.json`)) starts[e.id] = e.s;
  document.getElementById("stats").textContent = t("reg.stats", { tested: num(reg.tested.length),
    persons: num(reg.persons.length), places: num(reg.places.length), institutions: num(reg.institutions.length) });
  document.getElementById("kind").onchange = draw;
  document.getElementById("filter").oninput = draw;
  document.getElementById("sum").innerHTML = reg.tested.map(id => `<tr><td>${link(id)}</td><td>${esc(reg.summaries[id] || "")}</td></tr>`).join("");
  draw();
})();
</script>
</body>
</html>
