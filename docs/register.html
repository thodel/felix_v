<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullarium Felix’ V.</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<main>
  <h1><span data-i18n="reg.h1"></span> <span class="badge-auto" data-i18n="reg.badge"></span></h1>
  <p class="lede" data-i18n="reg.lede2"></p>
  <p class="note" data-i18n="reg.note2"></p>
  <p id="stats" class="muted"></p>
  <div class="toolbar" style="padding-left:0">
    <select id="kind" data-i18n-attr="aria-label:reg.h1">
      <option value="persons" data-i18n="reg.kind.persons"></option>
      <option value="places" data-i18n="reg.kind.places"></option>
      <option value="dioceses" data-i18n="reg.kind.dioceses"></option>
      <option value="institutions" data-i18n="reg.kind.institutions"></option>
    </select>
    <input id="filter" type="search" style="width:200px" data-i18n-attr="placeholder:reg.filter;aria-label:reg.filter">
    <label><input type="checkbox" id="linked"> <span data-i18n="reg.onlyLinked"></span></label>
    <label><input type="checkbox" id="multi"> <span data-i18n="reg.onlyMulti"></span></label>
    <span id="count" class="muted"></span>
  </div>
  <div class="tablewrap"><table><thead><tr data-i18n-th="reg.th2"></tr></thead>
    <tbody id="rows"><tr><td colspan="5" data-i18n="loading"></td></tr></tbody></table></div>
  <p class="muted" style="font-size:.85rem" data-i18n="reg.sources"></p>
</main>
<script src="i18n.js?v=8"></script>
<script src="common.js?v=8"></script>
<script>
header("register.html");
setTitle("title.register");
let ents = [];
const SRC = { kf: "Königsfelden", ssrq: "SSRQ", hls: "HLS", wikidata: "Wikidata" };

function linkBadge(l) {
  const g = l.grade === "identical" ? t("reg.grade.identical") : t("reg.grade.very_likely");
  const tip = `${SRC[l.source] || l.source} ${l.id} · ${g}`;
  const body = `<span class="src">${SRC[l.source] || esc(l.source)}</span> ${esc(l.label || l.id)}${l.dates ? ` <span class="muted">${esc(l.dates)}</span>` : ""}${l.grade === "very_likely" ? " ≈" : ""}`;
  return l.url ? `<a class="lnk" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(tip)}">${body}</a>`
               : `<span class="lnk" title="${esc(tip)}">${body}</span>`;
}

function entryLink(id, at) {
  if (!at) return `<span class="mono">${id}</span>`;
  return `<a class="mono" href="band.html?v=${at[0]}&p=${at[1]}&l=${at[2] + 1}">${id}</a>`;
}

function draw() {
  const kind = document.getElementById("kind").value, f = document.getElementById("filter").value.toLowerCase(),
    onlyL = document.getElementById("linked").checked, onlyM = document.getElementById("multi").checked;
  const rows = ents.filter(e => e.kind === kind && (!onlyL || e.links.length) && (!onlyM || e.entries.length > 1)
    && (!f || JSON.stringify([e.label, e.forms, e.links, e.dioc, e.offices]).toLowerCase().includes(f)));
  document.getElementById("count").textContent = t("reg.count", { n: num(rows.length) });
  const shown = rows.slice(0, 600);
  document.getElementById("rows").innerHTML = shown.map(e => {
    const info = [...e.roles, ...e.offices, ...e.dioc.map(d => `${t("rg.dioc")} ${d}`), ...e.types].map(esc).join(" · ");
    const grade = e.grade === "very_likely" ? ` <span class="muted" title="${esc(t("reg.grade.merged"))}">≈</span>` : "";
    return `<tr><td>${esc(e.label)}${grade}</td>
      <td style="font-family:'Source Serif 4',Georgia,serif">${e.forms.map(esc).join("; ")}</td>
      <td class="muted">${info}</td>
      <td>${e.links.map(linkBadge).join("<br>") || '<span class="muted">–</span>'}</td>
      <td>${e.entries.slice(0, 12).map(id => entryLink(id, e.at[id])).join(" ")}${e.entries.length > 12 ? ` <span class="muted">+${e.entries.length - 12}</span>` : ""}</td></tr>`;
  }).join("") + (rows.length > shown.length ? `<tr><td colspan="5" class="muted">${t("reg.more", { n: num(rows.length - shown.length) })}</td></tr>` : "");
}

(async () => {
  try { ents = await getJSON("data/entities.json"); }
  catch (e) { document.getElementById("rows").innerHTML = `<tr><td colspan="5">${t("reg.none")}</td></tr>`; return; }
  const by = k => ents.filter(e => e.kind === k);
  const linked = k => by(k).filter(e => e.links.length).length;
  document.getElementById("stats").textContent = t("reg.stats2", {
    p: num(by("persons").length), pl: num(linked("persons")), o: num(by("places").length), ol: num(linked("places")),
    d: num(by("dioceses").length), dl: num(linked("dioceses")), i: num(by("institutions").length) });
  ["kind", "linked", "multi"].forEach(id => document.getElementById(id).onchange = draw);
  document.getElementById("filter").oninput = draw;
  draw();
})();
</script>
</body>
</html>
