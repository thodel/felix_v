<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullarium Felix’ V. · Bullaire de Félix V · Bullarium Felicis V</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<main class="narrow">
  <h1><span data-i18n="brand"></span> <span class="badge-auto" data-i18n="badge.auto"></span></h1>
  <p class="lede" data-i18n="idx.lede"></p>
  <p class="note" data-i18n="idx.note"></p>
  <div id="vols" class="vols" aria-live="polite" data-i18n="loading"></div>
  <h2 data-i18n="idx.overview"></h2>
  <div class="tablewrap"><table id="tab"><thead><tr data-i18n-th="idx.th" data-num="1,2,3,4,5"></tr></thead><tbody></tbody></table></div>
  <p class="muted" style="font-size:.9rem" data-i18n="idx.checked"></p>
  <p class="muted" style="font-size:.85rem" data-i18n="idx.credits"></p>
</main>
<script src="i18n.js?v=13"></script>
<script src="common.js?v=13"></script>
<script>
header("index.html");
setTitle("title.index");
(async () => {
  const s = await getJSON("data/summary.json");
  const fmt = iso => iso ? fmtDate({ iso }) : "–";
  document.getElementById("vols").innerHTML = s.map(v => `
    <a class="vol" href="band.html?v=${v.vol}">
      <img src="${IIIF_IMG(v.thumb, "600,")}" alt="${t("idx.alt", { v: ROMAN[v.vol] })}" loading="lazy">
      <div class="body"><h3>${t("vol")} ${ROMAN[v.vol] || v.vol}</h3>
        <div class="meta">${t("idx.card", { pages: num(v.pages), entries: num(v.entries) })}</div>
        <div class="meta">${fmt(v.from)} – ${fmt(v.to)}</div></div></a>`).join("");
  document.querySelector("#tab tbody").innerHTML = s.map(v => `<tr>
    <td><a href="band.html?v=${v.vol}">${t("vol")} ${ROMAN[v.vol]}</a> <span class="muted">(Doc ${v.docId})</span></td>
    <td class="num">${num(v.pages)}</td><td class="num">${num(v.lines)}</td>
    <td class="num"><a href="eintraege.html?v=${v.vol}">${num(v.entries)}</a></td><td class="num">${num(v.dated)}</td><td class="num">${num(v.checked)}</td>
    <td>${fmt(v.from)} – ${fmt(v.to)}</td></tr>`).join("");
})().catch(e => { document.getElementById("vols").textContent = `${t("error")}: ${e.message}`; });
</script>
</body>
</html>
