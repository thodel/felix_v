<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullarium Felix’ V.</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<main class="narrow">
  <h1 data-i18n="m.h1"></h1>
  <p class="lede" id="lede"></p>

  <h2 data-i18n="m.h.source"></h2>
  <p data-i18n="m.source"></p>

  <h2 data-i18n="m.h.read"></h2>
  <p data-i18n="m.read"></p>
  <p class="note" data-i18n="m.read.note"></p>
  <div class="tablewrap"><table id="agg"><thead><tr data-i18n-th="m.read.th" data-num="1,2,3,4,5,6,7"></tr></thead><tbody></tbody></table></div>
  <p data-i18n="m.read.matrix"></p>
  <div class="tablewrap"><table id="matrix"><thead></thead><tbody></tbody></table></div>
  <ul>
    <li data-i18n="m.read.qwen"></li>
    <li data-i18n="m.read.gemini"></li>
    <li data-i18n="m.read.gt"></li>
    <li data-i18n="m.read.multi"></li>
    <li data-i18n="m.read.catmus"></li>
    <li data-i18n="m.read.comb"></li>
  </ul>
  <details><summary data-i18n="m.read.example"></summary>
    <div class="toolbar" style="padding-left:0"><select id="half" data-i18n-attr="aria-label:m.read.half"></select> <a id="half-link" href="#" data-i18n="m.read.view"></a></div>
    <div id="side" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"></div>
  </details>

  <h2 data-i18n="m.h.ner"></h2>
  <p data-i18n="m.ner.v2"></p>
  <p id="ner-intro"></p>
  <div id="ner-finding"></div>

  <h2 data-i18n="m.h.seg"></h2>
  <p data-i18n="m.seg.entries"></p>
  <p data-i18n="m.seg.date"></p>
  <div class="tablewrap"><table id="seg"><thead><tr data-i18n-th="m.seg.th" data-num="1,2,3,4,5"></tr></thead><tbody></tbody></table></div>
  <p data-i18n="m.seg.next"></p>
</main>
<script src="i18n.js?v=13"></script>
<script src="common.js?v=13"></script>
<script>
header("methode.html");
setTitle("title.method");
const STAND = "2026-11-15";
document.getElementById("lede").innerHTML = t("m.lede", { date: fmtDate({ iso: STAND }) });
(async () => {
  const s = await getJSON("data/summary.json");
  const seg = await Promise.all(s.map(v => getJSON(`data/entries${v.vol}.json`)));
  document.querySelector("#seg tbody").innerHTML = s.map((v, i) => {
    const e = seg[i];
    return `<tr><td><a href="eintraege.html?v=${v.vol}">${t("vol")} ${ROMAN[v.vol]}</a></td><td class="num">${num(e.length)}</td>
      <td class="num">${num(e.filter(x => x.d.iso).length)}</td><td class="num">${num(e.filter(x => x.d.check === "ok").length)}</td>
      <td class="num">${num(e.filter(x => x.d.check === "mismatch").length)}</td><td class="num">${num(e.filter(x => !x.cl).length)}</td></tr>`;
  }).join("");

  try {
    const reg = await getJSON("data/register.json");
    const st = reg.stats;
    document.getElementById("ner-intro").innerHTML = t("m.ner", { tested: num(st.tested) });
    const v = { persons: num(st.mentions.persons), places: num(st.mentions.places), institutions: num(st.mentions.institutions),
      secs: num(st.median_seconds), np: num(st.not_verbatim.persons), nl: num(st.not_verbatim.places),
      ni: num(st.not_verbatim.institutions), other: num(st.role_other) };
    document.getElementById("ner-finding").innerHTML = `<p>${t("m.ner.shows")}</p><ul>
      ${["m.ner.1", "m.ner.2", "m.ner.3", "m.ner.4"].map(k => `<li>${t(k, v)}</li>`).join("")}</ul>
      <p>${t("m.ner.assess")}</p>`;
  } catch (e) { /* no register yet */ }

  let rd;
  try { rd = await getJSON("data/readings.json"); } catch (e) { return; }
  const pct = x => x == null ? "–" : (100 * x).toFixed(0) + " %";
  const LBL = { "gemini-4-argon": "Gemini 4 Argon", "gemini-3.8-flash": "Gemini 3.8 Flash", "vote": t("m.read.vote") };
  const lbl = m => LBL[m] || m;
  document.querySelector("#agg tbody").innerHTML = Object.entries(rd.aggregate).map(([m, a]) => `<tr><td>${esc(lbl(m))}</td>
    <td class="num">${a.halves}</td><td class="num">${pct(a.median_cer_vs_htr)}</td><td class="num">${a.empty ?? "–"}</td><td class="num">${a.truncated}</td>
    <td class="num">${a.with_loops}</td><td class="num">${a.median_len_ratio}</td><td class="num">${a.median_seconds ?? "–"}</td></tr>`).join("");
  if (rd.matrix) {
    const names = rd.readers;
    document.querySelector("#matrix thead").innerHTML = `<tr><th></th>${names.map(n => `<th class="num">${esc(lbl(n))}</th>`).join("")}</tr>`;
    document.querySelector("#matrix tbody").innerHTML = names.map(a => `<tr><th>${esc(lbl(a))}</th>${names.map(b => {
      const c = (rd.matrix[a] || {})[b];
      return `<td class="num">${a === b ? "—" : c ? pct(c.median) : "–"}</td>`;
    }).join("")}</tr>`).join("");
  }
  const half = document.getElementById("half");
  const withR = rd.halves.filter(h => Object.keys(h.readers).length);
  half.innerHTML = withR.map((h, i) => `<option value="${i}">${t("vol")} ${ROMAN[h.vol]}, ${t("img")} ${h.page}, ${t(h.side === "L" ? "m.read.left" : "m.read.right")}</option>`).join("");
  const show = () => {
    const h = withR[+half.value];
    document.getElementById("half-link").href = `band.html?v=${h.vol}&p=${h.page}`;
    const col = (title, body) => `<div><h3 style="font-size:1rem;margin:.4em 0">${title}</h3><pre style="white-space:pre-wrap;font-family:'Source Serif 4',Georgia,serif;font-size:.9rem;margin:0">${esc(body)}</pre></div>`;
    document.getElementById("side").innerHTML = col("CITlab (Transkribus)", h.htr) +
      Object.entries(h.readers).map(([m, r]) => col(`${esc(lbl(m))} · ${t("m.read.dev")} ${pct(r.cer_vs_htr)}${r.truncated ? " · " + t("m.read.trunc") : ""}`, r.text)).join("");
  };
  half.onchange = show; if (withR.length) show();
})();
</script>
</body>
</html>
